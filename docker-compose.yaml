networks:
  bot_network:
    driver: bridge

services:
  bot:
    build: .
    container_name: fileify-bot
    restart: unless-stopped
    depends_on:
      - redis
    env_file:
      - .env
    networks:
      - bot_network
    volumes:
      # files downloaded by the local Bot API server are read from this path
      - bot_api_data:/var/lib/telegram-bot-api:ro

  redis:
    image: redis:7-alpine
    container_name: fileify-redis
    restart: unless-stopped
    networks:
      - bot_network
    volumes:
      - redis_data:/data

  # optional: `docker compose --profile local-api up` lifts the 20 MB file limit to 2 GB
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: fileify-bot-api
    restart: unless-stopped
    profiles:
      - local-api
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: 1
    networks:
      - bot_network
    volumes:
      - bot_api_data:/var/lib/telegram-bot-api

volumes:
  redis_data:
  bot_api_data:
